# Local Docker: bind-mount source + Vite watch (polling) so host edits hot-reload in the container.
# Override via env: IMAGE_TAG, DOCKER_NETWORK, INTERNAL_PORT, PUBLISH_PORT
name: netvan
services:
  netvan-webui:
    image: ${IMAGE_TAG:-netvan-webui:latest}
    build:
      context: .
      dockerfile: dockerfile
    container_name: netvan-webui
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NETVAN_API_PROXY_TARGET: http://netvan-api:8000
      VITE_BASE_PATH: /netvan/
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_ORIGIN: http://pc-armin
      VITE_HMR_HOST: pc-armin
      VITE_HMR_CLIENT_PORT: "80"
      VITE_HMR_PROTOCOL: ws
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_INTERVAL: "400"
    volumes:
      - .:/app
      - netvan-webui-node-modules:/app/node_modules
    expose:
      - "${INTERNAL_PORT:-8001}"
    ports:
      - target: ${INTERNAL_PORT:-8001}
        published: ${PUBLISH_PORT-8081}
        protocol: tcp
    networks:
      - netvan-net

networks:
  netvan-net:
    name: ${DOCKER_NETWORK:-netvan-net}
    external: true

volumes:
  netvan-webui-node-modules:
